name: Update profile README

on:
  schedule:
    # 06:17 every day in Asia/Tokyo.
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update-readme.mjs"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=%238338ec&color_dots=%23ebedf0,%23a5f3fc,%2367e8f9,%2322d3ee,%2306b6d4
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%2306d6a0&color_dots=%230f172a,%23164e63,%230e7490,%2322d3ee,%23a7f3d0

      - name: Regenerate README
        run: node scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          README_OWNER: SSsan-00
          README_REPOSITORY: SSsan-00
          README_TIME_ZONE: Asia/Tokyo

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if [ -d assets ]; then
            git add assets
          fi

          if git diff --cached --quiet; then
            echo "Profile README and contribution snake are already up to date."
            exit 0
          fi

          git commit -m "chore: update profile visuals"
          git push
