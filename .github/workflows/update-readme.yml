name: Update profile README

on:
  schedule:
    # 06:17 every Monday in Asia/Tokyo.
    - cron: "17 21 * * 0"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update-readme.mjs"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Regenerate README
        run: node scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          README_OWNER: SSsan-00
          README_REPOSITORY: SSsan-00
          README_TIME_ZONE: Asia/Tokyo

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "README.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update profile README"
          git push
